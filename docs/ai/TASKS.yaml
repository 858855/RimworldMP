  acceptance:
  - Eigenständiger Serverprozess und zwei Client-Prozesse starten
  - Beide Clients erhalten denselben Lobbyzustand nach Join und Ready
  - Disconnect entfernt den Spieler aus dem Zustand des verbleibenden Clients
