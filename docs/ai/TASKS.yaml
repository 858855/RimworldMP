- id: HOST-001
  title: Lobby ohne separaten Serverprozess aus der Mod hosten
  goal: Ein Spieler startet die autoritative Lobby direkt im RimWorld-Mod und ein Kollege verbindet sich per LAN-IP.
  description: Serverkern in spielunabhängige netstandard2.1-Bibliothek auslagern; Listen-Host und UI ergänzen.
  priority: critical
  components:
  - dedicated_server
  - lobby_core
  - network_core
  - rimworld_adapter
  - mod_package
  depends_on:
  - LOBBY-001
  - CLIENT-001
  - PKG-001
  scope:
  - src/Multiplayer.Foundation.Hosting/
  - src/Multiplayer.Foundation.Server/
  - src/Multiplayer.Foundation.RimWorld/
  - tests/Hosting.Tests/
  - scripts/build-mod.sh
  - scripts/package-mod.py
  - releases/
  non_goals:
  - Gameplay-Synchronisation, Peer-to-Peer-Protokoll ohne Host-Autorität, öffentlicher Internetbetrieb
  acceptance:
  - In-Game-Host benötigt keinen separaten Serverprozess
  - Zweiter Client kann per TCP beitreten und gleichen Lobby-/Ready-Zustand sehen
  - Host-Stopp trennt den Gast und gibt den Listener frei
  - Dedizierter Server und bestehende Tests bleiben funktionsfähig
  - Aktualisiertes installierbares ZIP liegt auf GitHub
  test_strategy: Hosting-Integration, bestehende Server-/Mehrprozess-Tests, Mod-Release-Build und ZIP-Prüfung.
  risks:
  - RimWorld-1.6-Mono-Laufzeit des Mod-Adapters bleibt ohne Spieltest unbestätigt
  - Host-IP muss für Kollegen erreichbar und LAN-Firewall geöffnet sein
  implementation: implemented
  verification: tests_passed
  integration: merged
  branch: release/mod-install-0.1-dev
  base_branch: fix/server-heartbeat
  evidence:
  - docs/verification/2026-10-15-direct-host.md
- id: STEAM-001
  title: Heimnetz-übergreifendes Hosting und Beitreten über Steam
  goal: Zwei RimWorld-Spieler hinter verschiedenen Heimroutern können abwechselnd hosten und per Steam-Einladung beitreten.
  description: Steam-Freundeslobby zur Einladung und Steam Networking P2P als zusätzlichen Transport für das bestehende Foundation-Protokoll anbinden.
  priority: critical
  components:
  - network_core
  - dedicated_server
  - rimworld_adapter
  - mod_package
  depends_on:
  - HOST-001
  - NET-001
  scope:
  - src/Multiplayer.Foundation.Network/
  - src/Multiplayer.Foundation.Hosting/
  - src/Multiplayer.Foundation.RimWorld/
  - tests/
  - docs/
  - releases/
  non_goals:
  - Gameplay-Synchronisation, Steam-Test-App-ID 480, öffentlicher TCP-Port oder eigenes Relay-Hosting
  acceptance:
  - Host erstellt eine Steam-Freundeslobby und öffnet den P2P-Listener
  - Gast nimmt Einladung an und führt den Foundation-Handshake über Steam P2P aus
  - Lobby- und Ready-Zustand verwenden denselben autoritativen Serverkern
  - Beide Spieler können nacheinander Host sein
  - TCP- und Dedicated-Server-Modus bleiben funktionsfähig
  - Zwei Steam-Konten auf getrennten Heimanschlüssen haben die Verbindung tatsächlich geprüft
  test_strategy: Transport-/Server-Tests, Mod-Release-Build und zwei echte Steam-Spielclients hinter getrennten Heimanschlüssen.
  risks:
  - Steam-Verbindung laut Nutzer erfolgreich; genauer Ablauf und Umgebung noch nicht dokumentiert
  - Lobby-/Ready-/Disconnect- und Host-Wechsel-Test für den Abschluss noch nicht belegt
  implementation: in_progress
  verification: build_passed
  integration: merged
  branch: feat/steam-friends-p2p
  base_branch: main
  base_commit: 5b533cd
  evidence:
  - docs/verification/2026-10-15-steam-transport.md
  - docs/verification/2026-10-15-steam-user-connection.md
  - docs/decisions/0010-steam-home-host.md
  - docs/reviews/2026-10-15-steam-transport-merge.md
