verified_capabilities:
- 'Archiv: 49 Einträge gegen eingebettetes Manifest geprüft.'
- Drei XML-Beispiele syntaktisch geprüft; kein RimWorld-Laufzeitnachweis.
- Lokale RimWorld-Version und Steam-Build aus Installationsdateien gelesen.
- 'Wire-Version 2: 6 automatisierte Protokoll-Testgruppen bestanden (Frame/Payload/Chat).'
- 'TCP-Loopback: Handshake, paralleles Senden, Ablehnung und Timeout mit Network.Tests bestanden.'
- Dedicated Server Release-Build ohne Warnungen.
- 'Zwei echte TCP-Clients: Handshake, Lobby, Ready, Host-Rechte, Disconnect, Heartbeat und Shutdown in
  Integration.Tests bestanden.'
- RimWorld-1.6-Mod gegen lokale netstandard2.1-Assemblies ohne Warnungen gebaut; Paket enthält About.xml
  und fünf eigene DLLs.
- 'LobbyClient: Snapshot, automatische Pong-Antwort über >4 Sekunden und Disconnect gegen echten TCP-Server
  getestet.'
- 'Erweiterter TCP-Test: Reconnect ohne Doppelmitgliedschaft, ungültige Wire-Version abgelehnt und Host-Rechte
  nach Disconnect übertragen; insgesamt 13 Integrationstestgruppen bestanden.'
- 'Mehrprozess-Test: eigenständiger Server und zwei unabhängige Client-Prozesse, Lobby-Liste, Join, gleiche Snapshots, Ready und Disconnect bestanden.'
- 'Server: verzögertes gültiges Pong akzeptiert, Duplikat und ungesendete Nonce abgelehnt; SIGTERM beendet den Linux-Prozess mit verbundenem Client geordnet.'
- 'Mod-ZIP: Release-Build gegen lokale 1.6-Assemblies, sieben Archiveinträge, Entpacken nach RimWorld/Mods und SHA-256 geprüft; kein Spiel-Laufzeittest.'
- 'Direkt-Hosting: Host und Gast verbinden sich über denselben TCP-Lobby-Kern, Join/Ready und Host-Stopp in vier Testgruppen bestanden; dedizierter Server bleibt erhalten.'
- 'Stream-Anschluss: zusätzlicher Client über eingespeisten Duplex-Stream, Handshake und Lobby-Beitritt getestet; Steam-Netzwerk selbst nicht getestet.'
- 'Steam-Adapter gegen lokal installierte RimWorld-1.6-Steamworks.NET-Assembly mit null Warnungen gebaut; kein Steam-Laufzeittest.'
- 'Steam-Vorschau-ZIP: sieben Einträge und SHA-256 geprüft; Steam-Laufzeit durch Codex nicht nachgewiesen, Nutzerbericht separat erfasst.'
- 'Lobby-Chat: zwei TCP-Clients empfangen dieselbe serverseitig zugeordnete Nachricht; Nichtmitglieder/andere Lobby isoliert, ungültiger Text abgelehnt.'
- 'Menü-/Chat-Vorschau: RimWorld-1.6-Release-Build mit Harmony-Patch ohne Warnungen; neun ZIP-Einträge und lokale Installation bytegleich geprüft.'
- 'Lobby 0.2-Vorschau (feat/lobby-hardening): Spielerschlüssel, Chunk-Übertragung (50 MB über TCP), Mod-Manifest mit Ready-Sperre und Unterschiedsbericht, Start-Knopf mit Lobby-Sperre in sechs Testprojekten bestanden (.NET-8-Harness); Mod ohne Warnungen gebaut; Rauchtest im Spiel: Mod lädt und loggt das Manifest. Siehe docs/verification/2026-10-15-lobby-hardening.md.'
- 'VER-001 Metadatenteil: alle im Gesamtplan Teil A-B benötigten RimWorld-1.6-Symbole in Assembly-CSharp.dll (1.6.4871 rev590 Windows) vorhanden; siehe references/verified-apis.md.'
user_reported_capabilities:
- 'Lobby-0.2-Vorschau (feat/lobby-hardening) laut Benutzer am 2026-10-15 mit zwei Spielern funktionsfähig („works“); Ablauf und Transport nicht dokumentiert.'
- 'Steam-Verbindung laut Benutzer am 2026-10-15 erfolgreich; Ablauf, Heimanschlüsse und weitere Lobbyfunktionen noch nicht dokumentiert. Siehe docs/verification/2026-10-15-steam-user-connection.md.'
- 'Multiplayer-Knopf direkt unter Tutorial und Fensteröffnung vom Benutzer am 2026-10-15 im Spiel bestätigt; siehe docs/verification/2026-10-15-menu-chat.md.'
- 'Spieltest durch Benutzer (Windows, 1.6.4871 rev590): Mod lädt, Einstellungsfenster bedienbar, Direkt-Host erstellt Lobby. Dabei gefundene UPnP-/Adressfehler auf fix/internet-connectivity korrigiert.'
- 'Branch fix/internet-connectivity: Dual-Stack-Bindung `::`, Client über IPv6/DNS mit Fallback und UPnP gegen Fake-Gateway getestet (sieben Testprojekte unter .NET 8); Mod-Build gegen Windows-1.6-Installation (rev590) ohne Warnungen; SSDP gegen echte FRITZ!Box nur lesend.'
- 'Merge von feat/main-menu-chat und fix/internet-connectivity in main: RimWorld-1.6-Mod (Linux, 1.6.4871 rev598) ohne Warnungen gebaut, Dedicated Server gebaut, alle sieben Testprojekte unter .NET 10.0.13 auf Linux bestanden. Siehe docs/verification/2026-10-15-merge-menu-chat-internet.md.'
known_issues:
- 'Wire-Version 3 (feat/lobby-hardening) ist nicht mit Wire-Version-2-Mods/Servern kombinierbar.'
- 'Tests der Lobby-0.2-Vorschau liefen unter .NET 8 statt .NET 10; ProcessIntegration.Tests und Serverbuild nicht ausgeführt.'
- 'RimWorld-UI durch Codex nicht verifiziert: -nographics verursacht Atlasfehler; grafischer Start
  kam auch im 180-s-Wiederholungsversuch nicht bis zu belegten Mod-Ladeeinträgen.'
- 'Version.txt meldet rev598, die gestartete Spiel-Runtime rev600; exakte Laufzeitkompatibilität offen.'
- 'Chat-UI, Steam-/IP-Bedienung und Enter-Shortcut im neuen Fenster noch nicht im Spiel geprüft.'
- 'Wire-Version 2 ist nicht mit älteren Version-1-Mods/Servern kombinierbar; beide Spieler benötigen dieselbe Vorschau.'
- Server und Client haben keine Authentifizierung/TLS; mit Standardbindung `::` und UPnP ist eine per IP gehostete Lobby öffentlich erreichbar.
- 'NET-002: echte Internetverbindung, UPnP-Freigabe am echten Router und Mono-Laufzeit im Spiel nicht geprüft.'
- 'Zusammengeführtes Verbindungsfenster (Steam, IP mit UPnP-Option, Erreichbarkeitsanzeige neben Chat) nur gebaut, nicht im Spiel geprüft.'
blockers:
- Vollständiger RimWorld-UI-Laufzeittest in dieser Umgebung offen.
- 1.7-Unterstützung ungeklärt.
- Umfang und Umgebung des gemeldeten Steam-Verbindungstests noch nicht dokumentiert.
- Chat mit zwei RimWorld-Clients offen.
